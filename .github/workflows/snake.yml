name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: debdut404
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#10B981&color_dots=#2d3343,#064e3b,#047857,#059669,#10B981
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22D3EE&color_dots=#2d3343,#164e63,#0891B2,#22D3EE,#A78BFA

      - name: Publish snake SVGs
        uses: crazy-max/ghactiongithub-pages@v3.1.0
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
